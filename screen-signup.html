<!-- ============================================================
     screen-signup.html — SIGNUP SCREEN
     Fields: MAIL ID, PWID, CENTER (dropdown), ROLE, Password
     Loaded into #screen-signup by loader.js
     ============================================================ -->
<div id="signupScreen" class="screen">
  <div class="login-wrapper">
    <div class="login-left">
      <div class="login-brand">
        <img src="assets/pw-logo.webp" alt="Physics Wallah" class="pw-logo-hero">
        <h1>Physics Wallah</h1>
        <p class="login-tagline">Create your account — approval required</p>
      </div>
      <div class="login-features">
        <div class="feature-item"><span class="feat-icon">&#128197;</span><span>Your request goes to your reporting manager</span></div>
        <div class="feature-item"><span class="feat-icon">&#128233;</span><span>Approve via email buttons</span></div>
        <div class="feature-item"><span class="feat-icon">&#9203;</span><span>Account activates after approval</span></div>
      </div>
    </div>
    <div class="login-right">
      <div class="login-card">
        <div class="login-card-logo">
          <img src="assets/pw-logo.webp" alt="PW" class="pw-logo-sm-login">
        </div>
        <h2>Create Account</h2>
        <p class="login-subtitle">Fill details — ID will be created after approval</p>
        <form id="signupForm" onsubmit="handleSignup(event)">
          <div class="input-group">
            <label>MAIL ID</label>
            <input type="email" id="signupEmail" placeholder="Enter your @pw.live email" required>
            <div class="signup-hint">Only @pw.live emails can sign up</div>
          </div>
          <div class="input-group">
            <label>PWID</label>
            <input type="text" id="signupPwid" placeholder="Enter your PW ID" required>
          </div>
          <div class="input-group">
            <label>CENTER</label>
            <select id="signupCenter">
              <option value="">Select center...</option>
            </select>
          </div>
          <div class="input-group">
            <label>ROLE</label>
            <select id="signupRole" onchange="updateRoleHint()">
              <option value="">Select role...</option>
            </select>
            <div class="signup-hint" id="roleHint"></div>
          </div>
          <div class="input-group">
            <label>Password</label>
            <div class="password-wrapper">
              <input type="password" id="signupPassword" placeholder="Min 4 characters" required>
              <button type="button" class="pass-toggle" onclick="togglePass('signupPassword', this)" tabindex="-1">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn-primary" id="signupBtn">
            <span>Submit for Approval</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
        </form>
        <a href="#" class="forgot-link" onclick="showScreen('loginScreen')">&larr; Back to Login</a>
        <div id="signupError" class="alert alert-error"></div>
        <div id="signupSuccess" class="alert alert-success"></div>
      </div>
    </div>
  </div>
</div>
